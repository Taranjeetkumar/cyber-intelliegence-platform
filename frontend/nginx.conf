server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Regular API calls
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── FIX: SSE endpoint needs buffering disabled or nginx holds the stream
  #    and the browser stays stuck on "Connecting" forever.
  location /api/alerts/stream {
    proxy_pass http://backend:5000/api/alerts/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # These three lines are the actual fix:
    proxy_buffering      off;         # don't buffer — send each SSE chunk immediately
    proxy_cache          off;         # no caching for a live stream
    proxy_read_timeout   86400s;      # keep the long-lived connection open (24h)

    # Tell nginx not to close the connection when the backend sends keep-alive pings
    proxy_set_header Connection '';
    chunked_transfer_encoding on;
  }

  location / {
    try_files $uri /index.html;
  }
}
