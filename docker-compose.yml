version: "3.9"

services:
  # ── MongoDB
  mongodb:
    image: mongo:7
    container_name: cti_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cti_platform
    volumes:
      - mongo_data:/data/db
    networks:
      - cti_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis
  redis:
    image: redis/redis-stack:latest
    container_name: cti_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001" 
    volumes:
      - redis_data:/data
    networks:
      - cti_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j
  neo4j:
    image: neo4j:5
    container_name: cti_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/cti_password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - cti_net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "cti_password123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:

networks:
  cti_net:
    driver: bridge
