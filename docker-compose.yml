services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cti-frontend:latest
    container_name: cti_frontend
    restart: unless-stopped
    init: true
    ports:
      - "80:8080"
    depends_on:
      - backend
      - honeypod-ssh
      - honeypod-http
      - honeypod-telnet
    networks:
      - cti_net
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cti-backend:latest
    container_name: cti_backend
    restart: unless-stopped
    init: true
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost
      MONGO_URI: mongodb://mongodb:27017/cti_platform
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cti_password123
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      ABUSEIPDB_MAX_AGE_DAYS: 90
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - cti_net
    security_opt:
      - no-new-privileges:true

  mongodb:
    image: mongo:7
    container_name: cti_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cti_platform
    volumes:
      - mongo_data:/data/db
    networks:
      - cti_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    container_name: cti_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    networks:
      - cti_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: cti_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   
      - "7687:7687" 
    environment:
      NEO4J_AUTH: neo4j/cti_password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - cti_net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "cti_password123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  honeypod-ssh:
    build:
      context: ./honeypods
      dockerfile: ssh/Dockerfile
    image: honeypod-ssh:latest
    container_name: honeypod_ssh
    restart: unless-stopped
    init: true
    ports:
      - "2222:2222"
    environment:
      BACKEND_EVENT_URL: http://backend:5000/api/honeypot/events
      PORT: 2222
      SENSOR_ID: honeypod-ssh
    depends_on:
      - backend
    networks:
      - cti_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  honeypod-http:
    build:
      context: ./honeypods
      dockerfile: http/Dockerfile
    image: honeypod-http:latest
    container_name: honeypod_http
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      BACKEND_EVENT_URL: http://backend:5000/api/honeypot/events
      PORT: 8080
      SENSOR_ID: honeypod-http
    depends_on:
      - backend
    networks:
      - cti_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  honeypod-telnet:
    build:
      context: ./honeypods
      dockerfile: telnet/Dockerfile
    image: honeypod-telnet:latest
    container_name: honeypod_telnet
    restart: unless-stopped
    init: true
    ports:
      - "2323:2323"
    environment:
      BACKEND_EVENT_URL: http://backend:5000/api/honeypot/events
      PORT: 2323
      SENSOR_ID: honeypod-telnet
    depends_on:
      - backend
    networks:
      - cti_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:

networks:
  cti_net:
    driver: bridge
